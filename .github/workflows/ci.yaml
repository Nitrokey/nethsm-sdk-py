name: Continuous integration
on:
  pull_request:
  push:
    branches:
      - main

env:
  POETRY_SPEC: poetry >=2, <2.3
  PIP_UPLOADED_PRIOR_TO: P0D
  POETRY_SOLVER_MIN_RELEASE_AGE: 0

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
  format-code:
    name: Check code format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Install Poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: make install
      - name: Check code format
        run: make check-format
  lint-style:
    name: Check code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Install Poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: make install
      - name: Check code style
        run: make check-style
  lint-typing:
    name: Check static typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Install Poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: make install
      - name: Check code static typing
        run: make check-typing
  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # to reduce the number of jobs, we test against the latest minor release for each major
        # release (except for v1.0 because it would require too many changes)
        tag:
          - testing-v2.2
          - testing-v3.1
          - testing-v4.0
          - testing-v5.0
          - testing-v5.1
          - testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Install Poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: make install
      - name: Check code with integration tests
        run: make test
        env:
          NETHSM_IMAGE: nitrokey/nethsm:${{ matrix.tag }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: backup
          path: backupNethsm.bin
      - name: upload coverage
        if: matrix.tag == 'testing'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
      - name: login to DockerHub
        if: github.event_name == 'push' && github.ref_name == 'main' && matrix.tag == 'testing'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push sdk tag
        if: github.event_name == 'push' && github.ref_name == 'main' && matrix.tag == 'testing'
        run: |
          docker tag docker.io/nitrokey/nethsm:testing docker.io/nitrokey/nethsm:latest-sdk
          docker push docker.io/nitrokey/nethsm:latest-sdk
  clean-install:
    name: Try a clean install with pip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Create virtual environment
        run: python3 -m venv venv
      - name: Install package
        run: venv/bin/pip install .
      - name: Use package
        run: venv/bin/python3 -c "import nethsm"
