name: Continuous integration
on:
  pull_request:
  push:
    branches:
      - main

env:
  POETRY_SPEC: poetry >=2, <2.3

jobs:
  format-code:
    name: Check code format
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install required packages
        run: |
          apt update
          apt install -y make
      - name: Install Poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: make install
      - name: Check code format
        run: make check-format
  lint-style:
    name: Check code style
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install required packages
        run: |
          apt update
          apt install -y make
      - name: Install Poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: make install
      - name: Check code style
        run: make check-style
  lint-typing:
    name: Check static typing
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install required packages
        run: |
          apt update
          apt install -y make
      - name: Install Poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: make install
      - name: Check code static typing
        run: make check-typing
  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # to reduce the number of jobs, we test against the latest minor release for each major
        # release (except for v1.0 because it would require too many changes)
        tag:
          - testing-v2.2
          - testing-v3.1
          - testing-v4.0
          - testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y make
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install Poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: make install
      - name: Check code with integration tests
        run: make test
        env:
          NETHSM_IMAGE: nitrokey/nethsm:${{ matrix.tag }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: backup
          path: backupNethsm.bin
      - name: upload coverage
        if: matrix.tag == 'testing'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
      - name: login to DockerHub
        if: github.event_name == 'push' && github.ref_name == 'main' && matrix.tag == 'testing'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push sdk tag
        if: github.event_name == 'push' && github.ref_name == 'main' && matrix.tag == 'testing'
        run: |
          docker tag docker.io/nitrokey/nethsm:testing docker.io/nitrokey/nethsm:latest-sdk
          docker push docker.io/nitrokey/nethsm:latest-sdk
  clean-install:
    name: Try a clean install with pip
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Create virtual environment
        run: python3 -m venv venv
      - name: Install package
        run: venv/bin/pip install .
      - name: Use package
        run: venv/bin/python3 -c "import nethsm"
